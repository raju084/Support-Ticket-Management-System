version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: stms_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: support_tickets
    networks:
      - stms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stms_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/support_tickets
      JWT_SECRET: change_this_jwt_secret_in_production_32chars
      JWT_REFRESH_SECRET: change_this_refresh_secret_in_production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - stms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stms_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - stms_network

networks:
  stms_network:
    driver: bridge

volumes:
  mongo_data:
